<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCM</title>
  <link rel="stylesheet" href="css/style-mo.css">
</head>
<body>
  <header class="mo-header">
    <div class="mo-header__logo">
      <img src="image/logo-pcm-white.svg" alt="PCM" class="mo-header__logo-img mo-header__logo-img--light">
      <img src="image/logo-pcm-black.svg" alt="PCM" class="mo-header__logo-img mo-header__logo-img--dark">
    </div>
    <button type="button" class="mo-header__menu" aria-label="메뉴 열기">
      <img src="image/ic-menu-white.svg" alt="" class="mo-header__menu-icon mo-header__menu-icon--light">
      <img src="image/ic-menu-black.svg" alt="" class="mo-header__menu-icon mo-header__menu-icon--dark">
    </button>
  </header>

  <div class="mo-menu">
    <div class="mo-menu__panel">
      <img src="image/주차상품권-menu.png" alt="" class="mo-menu__img">
      <div class="mo-menu__header">
        <button type="button" class="mo-menu__close" aria-label="메뉴 닫기">
          <img src="image/ic-close-black.svg" alt="">
        </button>
      </div>
    </div>
  </div>

  <div class="mo-btn-top-zone">
    <button type="button" class="mo-btn-top" aria-label="맨 위로 이동">
      <img src="image/ic-top-black.svg" alt="" class="mo-btn-top__icon">
    </button>
  </div>

  <main>

    <div class="mo-viewport">
      <div class="mo-track">
        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-hero.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-1.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-2.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-3.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-4.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-5.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-6.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-7.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-8.png" alt="" class="mo-frame__img">
          </div>
        </section>

        <section class="mo-slide">
          <div class="mo-frame">
            <img src="image/주차상품권-9.png" alt="" class="mo-frame__img mo-frame__img--cycle">
          </div>
        </section>

        <section class="mo-slide mo-slide--free">
          <div class="mo-slide__scroll">
            <div class="mo-frame mo-frame--free">
              <img src="image/주차상품권-11.png" alt="" class="mo-frame__img">
            </div>
          </div>
        </section>
      </div>
    </div>

  </main>
  <script src="js/main-mo.js"></script>
</body>
</html>
